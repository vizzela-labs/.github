name: PR padrão · regras do fluxo

# Checks que avisam, sem bloquear o merge (o plano Free não bloqueia em repo privado).
on:
  workflow_call:

jobs:
  como-testar:
    name: Como testar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          repository: vizzela-labs/.github
          ref: main
          path: .vzla
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            return await require('./.vzla/scripts/pr-checks.js')({ github, context, core, mode: 'como-testar' })

  spec:
    name: 'Spec: aprovações'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          repository: vizzela-labs/.github
          ref: main
          path: .vzla
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            return await require('./.vzla/scripts/pr-checks.js')({ github, context, core, mode: 'spec' })

  spec-formato:
    name: 'Spec: formato'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contratos: ${{ steps.lint.outputs.contratos }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: vizzela-labs/.github
          ref: main
          path: .vzla
          persist-credentials: false
      - id: lint
        uses: actions/github-script@v8
        with:
          script: |
            return await require('./.vzla/scripts/pr-checks.js')({ github, context, core, mode: 'spec-formato' })

  spec-contrato:
    name: 'Spec: contrato'
    needs: spec-formato
    if: always() && needs.spec-formato.outputs.contratos != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Redocly (regras mínimas)
        env:
          CONTRATOS: ${{ needs.spec-formato.outputs.contratos }}
        run: |
          # shellcheck disable=SC2086 # um caminho por palavra, de propósito
          npx --yes @redocly/cli@1 lint $CONTRATOS --extends=minimal --format=github-actions

  mock:
    name: 'Release: sem mock'
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          repository: vizzela-labs/.github
          ref: main
          path: .vzla
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            return await require('./.vzla/scripts/pr-checks.js')({ github, context, core, mode: 'mock' })

  revisor:
    name: Revisor sorteado
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: vizzela-labs/.github
          ref: main
          path: .vzla
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            return await require('./.vzla/scripts/pr-checks.js')({ github, context, core, mode: 'revisor' })
