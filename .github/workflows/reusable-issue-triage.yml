name: Backlog · triagem

# Instalado no vzla-backlog (workflow-templates/backlog-triagem.yml).
#   issue aberta              → comentário com o caminho sugerido e as perguntas em aberto
#   label quick-spec/spec/... → comentário com o rascunho da spec
# O Claude só comenta: não aplica label, não atribui, não fecha.
on:
  workflow_call:
    inputs:
      model:
        type: string
        default: claude-sonnet-5-5
    secrets:
      claude_code_oauth_token:
        required: false

jobs:
  claude:
    name: Claude
    if: >-
      !endsWith(github.event.issue.user.login, '[bot]') &&
      !startsWith(github.event.issue.title, '[') && (
      github.event.action == 'opened' ||
      (github.event.action == 'labeled' && contains(fromJSON('["quick-spec","spec","bugfix-spec"]'), github.event.label.name)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Confere secret e se já comentou
        id: guard
        env:
          CLAUDE_TOKEN: ${{ secrets.claude_code_oauth_token }}
          GH_TOKEN: ${{ github.token }}
          MARK: ${{ github.event.action == 'opened' && 'vzla:triagem' || 'vzla:spec-rascunho' }}
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::warning::Secret CLAUDE_CODE_OAUTH_TOKEN ausente no vzla-backlog. Triagem NÃO executada."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.issue.number }}/comments" --paginate --jq "[.[] | select(.body | contains(\"<!-- $MARK -->\"))] | length" | paste -sd+ - | bc)
          if [ "${n:-0}" -gt 0 ]; then echo "Já comentado ($MARK)."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Baixa as diretrizes e os modelos de vizzela-labs/.github
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          repository: vizzela-labs/.github
          ref: main
          path: .vzla
          sparse-checkout: |
            review
            specs-modelo
          persist-credentials: false

      - name: Claude
        if: steps.guard.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}
            TAREFA: ${{ github.event.action == 'opened' && 'triagem' || format('rascunho da spec ({0})', github.event.label.name) }}

            1. Leia `.vzla/review/triagem.md` e siga-o à risca para a TAREFA acima.
            2. Leia a issue com `gh issue view ${{ github.event.issue.number }} --comments`. Se ela tiver issue-mãe ou sub-issues, leia também.
            3. Para o rascunho da spec, leia os modelos em `.vzla/specs-modelo/`.
            4. Poste um único comentário com `gh issue comment ${{ github.event.issue.number }} --body-file <arquivo>`, começando pelo marcador indicado em triagem.md.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue list:*),Bash(gh search issues:*)"
            --disallowedTools "Edit,MultiEdit,Bash(gh issue edit:*),Bash(gh issue close:*),Bash(git commit:*),Bash(git push:*)"
            --append-system-prompt "Responda em português do Brasil. Você só comenta a issue: nunca aplica label, atribui, muda status nem fecha. Use Write apenas para criar o arquivo do comentário em /tmp."
