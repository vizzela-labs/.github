name: PR padrão · título

on:
  workflow_call:

jobs:
  valida:
    name: Valida título
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Baixa os scripts de vizzela-labs/.github
        uses: actions/checkout@v5
        with:
          repository: vizzela-labs/.github
          ref: main
          path: .vzla
          persist-credentials: false

      - name: Valida tipo(escopo) e aplica label
        uses: actions/github-script@v8
        with:
          script: return await require('./.vzla/scripts/pr-title.js')({ github, context, core })
