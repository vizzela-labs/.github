name: PR padrão · review Claude

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: claude-sonnet-5-5
      max_turns:
        type: number
        default: 40
    secrets:
      claude_code_oauth_token:
        required: false
      # Não usados mais (o review sai pelo App oficial do Claude). Mantidos só para
      # não quebrar os pr-padrao.yml já instalados, que ainda os repassam.
      app_id:
        required: false
      app_private_key:
        required: false

jobs:
  # Review automático: PR aberto, reaberto ou saindo de draft.
  review:
    name: Review automático
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Confere secrets
        id: guard
        env:
          CLAUDE_TOKEN: ${{ secrets.claude_code_oauth_token }}
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::warning::Secret CLAUDE_CODE_OAUTH_TOKEN ausente. Review do Claude NÃO executado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout do PR
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # a action do Claude faz git fetch e precisa das credenciais

      - name: Baixa as diretrizes de vizzela-labs/.github
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          repository: vizzela-labs/.github
          ref: main
          path: .vzla
          sparse-checkout: review
          persist-credentials: false

      - name: Review
        if: steps.guard.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Sem github_token: a action troca o OIDC do job por um token do App oficial
          # do Claude (github.com/apps/claude), e os comentários saem como "claude".
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            TÍTULO: ${{ github.event.pull_request.title }}
            BRANCH: ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}

            Faça o code review deste PR.

            1. Leia `.vzla/review/diretrizes.md`. Ele define o que procurar, o que ignorar e o formato da resposta. Siga-o à risca.
            2. Ignore a pasta `.vzla/` em si: ela não faz parte do PR.
            3. Leia `AGENTS.md`, `CLAUDE.md` e `README.md` do repo, se existirem.
            4. Veja o diff com `gh pr diff ${{ github.event.pull_request.number }}` e o contexto com `gh pr view ${{ github.event.pull_request.number }}`.
               Abra os arquivos tocados (e quem os chama) para entender o impacto, não revise só o diff.
            5. Publique os problemas como comentários inline e termine com o comentário final pelo `gh pr comment`.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"

  # Sob demanda: "@claude ..." num comentário do PR (só lê; "@claude corrija" é o job abaixo).
  mencao:
    name: Responde @claude
    if: >-
      !contains(github.event.comment.body, '@claude corrij') && (
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Confere secrets
        id: guard
        env:
          CLAUDE_TOKEN: ${{ secrets.claude_code_oauth_token }}
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::warning::Secret CLAUDE_CODE_OAUTH_TOKEN ausente. @claude NÃO executado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # a action do Claude faz git fetch e precisa das credenciais

      - name: Baixa as diretrizes de vizzela-labs/.github
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          repository: vizzela-labs/.github
          ref: main
          path: .vzla
          sparse-checkout: review
          persist-credentials: false

      - name: Claude
        if: steps.guard.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Sem github_token: a action troca o OIDC do job por um token do App oficial
          # do Claude (github.com/apps/claude), e os comentários saem como "claude".
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          trigger_phrase: '@claude'
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Glob,Grep,mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Bash(git commit:*),Bash(git push:*)"
            --append-system-prompt "Responda em português do Brasil. Se pedirem review, siga .vzla/review/diretrizes.md. Se pedirem para validar (ex.: '@claude valide'), siga a seção Validação de .vzla/review/diretrizes.md. Você não altera código: não faça commits nem abra PRs; explique a correção no comentário e lembre que '@claude corrija <o quê>' aplica a correção no PR."

  # "@claude corrija <o quê>": o Claude altera o código e commita NA BRANCH DO PR.
  # Nunca na dev nem na main, nunca em fork, nunca mergeia. Quem pediu revisa o commit.
  corrige:
    name: Corrige (@claude corrija)
    if: >-
      contains(github.event.comment.body, '@claude corrij') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && (
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event_name == 'pull_request_review_comment')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # contents: read basta: quem commita é o token do app do Claude (OIDC), não o github.token.
    # Pedir write aqui derruba o workflow inteiro (startup_failure), porque o caller dá read.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Confere secrets e a branch do PR
        id: guard
        env:
          CLAUDE_TOKEN: ${{ secrets.claude_code_oauth_token }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::warning::Secret CLAUDE_CODE_OAUTH_TOKEN ausente. @claude corrija NÃO executado."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          read -r head fork <<<"$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.head.ref, (.head.repo.full_name != .base.repo.full_name)] | @tsv')"
          if [ "$head" = dev ] || [ "$head" = main ] || [ "$fork" = true ]; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "O \`@claude corrija\` só commita em branch de trabalho do próprio repo (este PR sai de \`$head\`). Faça a correção numa branch e abra um PR."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Baixa as diretrizes de vizzela-labs/.github
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          repository: vizzela-labs/.github
          ref: main
          path: .vzla
          sparse-checkout: review
          persist-credentials: false

      - name: Claude
        if: steps.guard.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          trigger_phrase: '@claude'
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,mcp__github_comment__update_claude_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD:*),Bash(npm ci:*),Bash(npm run:*),Bash(npm test:*),Bash(pnpm install:*),Bash(pnpm run:*),Bash(pnpm test:*),Bash(npx tsc:*),Bash(npx prisma generate:*)"
            --disallowedTools "Bash(git push --force:*),Bash(git push -f:*),Bash(git rebase:*),Bash(git reset:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh pr close:*)"
            --append-system-prompt "Responda em português do Brasil. Faça só a correção pedida, no menor diff possível, seguindo AGENTS.md/CLAUDE.md do repo e as convenções de .vzla/review/diretrizes.md. Não mexa em .vzla/, .env, migrations já aplicadas nem em src/mocks/ de outra feature. Rode os testes ou o build que existirem antes de commitar. Commit no formato tipo(escopo): descrição, na branch do PR, sem --force. Nunca mergeie, aprove ou feche o PR. Termine dizendo o que mudou e o que quem pediu deve conferir."
