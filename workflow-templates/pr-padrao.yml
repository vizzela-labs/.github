# Gerado a partir de vizzela-labs/.github. Não edite a lógica aqui: ela mora nos
# workflows reutilizáveis de lá. Convenções: https://github.com/vizzela-labs/.github/blob/main/CONTRIBUTING.md
name: PR padrão

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  titulo:
    name: Título
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: vizzela-labs/.github/.github/workflows/reusable-pr-title.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write

  sub-issue:
    name: Sub-issue
    if: github.event_name == 'pull_request' && github.event.action != 'synchronize'
    concurrency:
      group: pr-padrao-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: vizzela-labs/.github/.github/workflows/reusable-pr-sync.yml@main
    permissions:
      contents: read
    secrets:
      app_id: ${{ secrets.VZLA_APP_ID }}
      app_private_key: ${{ secrets.VZLA_APP_PRIVATE_KEY }}

  review:
    name: Claude
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    uses: vizzela-labs/.github/.github/workflows/reusable-pr-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app_id: ${{ secrets.VZLA_APP_ID }}
      app_private_key: ${{ secrets.VZLA_APP_PRIVATE_KEY }}
