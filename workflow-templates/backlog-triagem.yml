# Só no vzla-backlog. Lógica em vizzela-labs/.github (reusable-issue-triage.yml + review/triagem.md).
name: Triagem

on:
  issues:
    types: [opened, labeled]

jobs:
  triagem:
    concurrency:
      group: triagem-${{ github.event.issue.number }}
      cancel-in-progress: false
    uses: vizzela-labs/.github/.github/workflows/reusable-issue-triage.yml@main
    permissions:
      contents: read
      issues: write
      id-token: write
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
